name: Scheduler and SMTP regression tests
on:
  pull_request:
    paths:
      - 'scripts/send_task_event_scheduler.mjs'
      - 'scripts/send_digest_smtp.mjs'
      - 'scripts/verify_gmail_smtp.mjs'
      - 'src/utils/taskScheduler*.js'
      - 'src/utils/gmailSmtp.js'
      - 'test/**'
      - '.github/workflows/*smtp*.yml'
      - '.github/workflows/send_task_event_scheduler.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
