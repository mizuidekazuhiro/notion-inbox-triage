name: Mobile App Tests

on:
  push:
    branches:
      - feature/mobile-inbox-task-pwa-20261013
  pull_request:
    paths:
      - "src/mobile/**"
      - "src/routes/mobileApp.js"
      - "src/notion/mobileData.js"
      - "src/index.js"
      - "src/routes/move.js"
      - "test/mobile-app.test.js"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker modules
        run: |
          node --check src/index.js
          node --check src/routes/mobileApp.js
          node --check src/notion/mobileData.js
          node --check src/mobile/client.js
          node --check src/mobile/icon.js
          node --check src/mobile/shell.js
      - name: Run unit tests
        run: npm test
