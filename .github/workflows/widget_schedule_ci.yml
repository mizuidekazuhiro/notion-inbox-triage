name: Weekly Schedule Widget Tests
on:
  push:
    branches:
      - feature/weekly-schedule-widget-main-20261014
  pull_request:
    paths:
      - "src/routes/widgetScheduleWeek.js"
      - "scripts/NotionWeekSchedule.js"
      - "test/widget-schedule-week.test.js"
      - "src/index.js"
      - "src/routes/widgetScheduleCalendar.js"
      - "scripts/NotionCalendarFourWeeks.js"
      - "test/widget-schedule-calendar.test.js"
      - "test/scriptable-calendar.test.js"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript
        run: |
          node --check src/index.js
          node --check src/routes/widgetScheduleWeek.js
          node --check scripts/NotionWeekSchedule.js
          node --check src/routes/widgetScheduleCalendar.js
          node --check scripts/NotionCalendarFourWeeks.js
      - name: Run repository tests
        run: npm test

